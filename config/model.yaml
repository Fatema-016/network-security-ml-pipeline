models:
  LogisticRegression:
    module: sklearn.linear_model
    params:
      C: [0.1, 1.0, 10.0]
      solver: [lbfgs]
      max_iter: [1000]

  RandomForestClassifier:
    module: sklearn.ensemble
    params:
      n_estimators: [100, 200]
      max_depth: [10, 20, null]
      min_samples_split: [2, 5]

  XGBClassifier:
    module: xgboost
    params:
      n_estimators: [100, 200]
      learning_rate: [0.05, 0.1]
      max_depth: [4, 6]
      scale_pos_weight: [1]